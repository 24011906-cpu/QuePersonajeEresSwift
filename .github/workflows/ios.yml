
name: Compilar QuePersonajeEresSwift

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar aplicación iOS
        run: |
          xcodebuild \
            -project QuePersonajeEresSwift.xcodeproj \
            -scheme QuePersonajeEresSwift \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Guardar aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: QuePersonajeEresSwift-iOS
          path: build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
